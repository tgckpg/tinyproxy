# Expose a remote Minecraft Bedrock server as a local LAN server.
#
# Clients on the local network can discover the remote server from the
# Minecraft "Friends" -> "LAN Games" tab without manually entering the
# server address.
#
# tinyproxy listens on UDP port 19132, forwards discovery requests to
# the remote server, and sends discovery replies back to local clients.
#
# Replace 123.123.123.123:19132 with your server address.
#
udp :19132 udp 123.123.123.123:19132 broadcast_reply=listen

# Advertise a Minecraft Bedrock server outside the local broadcast subnet.
#
# tinyproxy receives LAN discovery broadcasts on :19132, forwards them to
# 10.0.1.123:19132, then sends the discovery reply back as if it came from
# 10.0.1.123:19132.
#
# After discovery, the Minecraft client connects directly to 10.0.1.123:19132
# for gameplay traffic, so tinyproxy only handles discovery.
#
# This listener only bridges LAN discovery.
# Gameplay traffic goes directly to the advertised upstream address.
# Clients that cannot route to the upstream address may see the server in the
# LAN list, but they will not be able to join it.
udp :19132 udp 10.0.1.123:19132 broadcast_reply=upstream
